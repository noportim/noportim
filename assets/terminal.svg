<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="610" viewBox="0 0 1160 610" role="img" aria-labelledby="title desc">
  <title id="title">noportim terminal profile</title>
  <desc id="desc">ASCII portrait and developer profile information for Artem</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#09111d"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .ascii { font-size: 16px; fill: #7ee787; white-space: pre; }
      .title { font-size: 20px; font-weight: 700; fill: #7ee787; }
      .prompt { font-size: 15px; fill: #8b949e; }
      .key { font-size: 15px; fill: #79c0ff; }
      .value { font-size: 15px; fill: #c9d1d9; }
      .footer { font-size: 14px; fill: #8b949e; }
    </style>
  </defs>

