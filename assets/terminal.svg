  <rect x="20" y="20" width="1120" height="40" rx="10" fill="#161b22"/>
  <circle cx="43" cy="40" r="7" fill="#ff5f56"/>
  <circle cx="67" cy="40" r="7" fill="#ffbd2e"/>
  <circle cx="91" cy="40" r="7" fill="#27c93f"/>
